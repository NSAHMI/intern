<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - InternHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #22c55e;
            --danger: #ef4444;
            --gray: #6b7280;
            --dark: #1f2937;
            --light: #f3f4f6;
            --white: #ffffff;
            --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .auth-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Left Panel - Branding */
        .auth-branding {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3rem;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .auth-branding::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 50%);
        }

        .brand-content {
            position: relative;
            z-index: 1;
            max-width: 500px;
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
        }

        .brand-logo a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-content h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .brand-content p {
            font-size: 1.1rem;
            opacity: 0.9;
            line-height: 1.7;
        }

        /* Right Panel - Form */
        .auth-form-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--white);
            padding: 2rem;
            overflow-y: auto;
        }

        .auth-form-container {
            width: 100%;
            max-width: 450px;
            padding: 2rem 0;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--gray);
        }

        /* Role Selection */
        .role-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .role-option {
            position: relative;
        }

        .role-option input {
            position: absolute;
            opacity: 0;
        }

        .role-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            border: 2px solid var(--light);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .role-option label:hover {
            border-color: var(--primary);
        }

        .role-option input:checked + label {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .role-icon {
            width: 60px;
            height: 60px;
            background: var(--light);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--gray);
            margin-bottom: 1rem;
            transition: all 0.2s;
        }

        .role-option input:checked + label .role-icon {
            background: var(--gradient);
            color: white;
        }

        .role-option label h4 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.25rem;
        }

        .role-option label p {
            font-size: 0.8rem;
            color: var(--gray);
            margin: 0;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--light);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .password-strength {
            height: 4px;
            background: var(--light);
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            border-radius: 2px;
            transition: all 0.3s;
            width: 0;
        }

        .strength-weak { width: 33%; background: var(--danger); }
        .strength-medium { width: 66%; background: #f59e0b; }
        .strength-strong { width: 100%; background: var(--success); }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .terms input {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            accent-color: var(--primary);
        }

        .terms label {
            font-size: 0.85rem;
            color: var(--gray);
            line-height: 1.5;
        }

        .terms a {
            color: var(--primary);
            text-decoration: none;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            gap: 1rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--light);
        }

        .divider span {
            color: var(--gray);
            font-size: 0.85rem;
        }

        .auth-footer {
            text-align: center;
        }

        .auth-footer p {
            color: var(--gray);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* Mobile */
        @media (max-width: 968px) {
            .auth-branding {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .role-selection {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Left Panel - Branding -->
        <div class="auth-branding">
            <div class="brand-content">
                <div class="brand-logo">
                    <a href="index.html"><i class="fas fa-briefcase"></i> InternHub</a>
                </div>
                <h1>Start Your Journey Today</h1>
                <p>Join thousands of students and companies connecting on InternHub. Create your account and unlock endless opportunities.</p>
            </div>
        </div>

        <!-- Right Panel - Form -->
        <div class="auth-form-panel">
            <div class="auth-form-container">
                <div class="auth-header">
                    <h2>Create Account</h2>
                    <p>Fill in your details to get started</p>
                </div>

                <form id="registerForm">
                    <!-- Role Selection -->
                    <div class="role-selection">
                        <div class="role-option">
                            <input type="radio" name="role" id="student" value="student" checked>
                            <label for="student">
                                <div class="role-icon">
                                    <i class="fas fa-graduation-cap"></i>
                                </div>
                                <h4>Student</h4>
                                <p>Looking for internships</p>
                            </label>
                        </div>
                        <div class="role-option">
                            <input type="radio" name="role" id="company" value="company">
                            <label for="company">
                                <div class="role-icon">
                                    <i class="fas fa-building"></i>
                                </div>
                                <h4>Company</h4>
                                <p>Hiring interns</p>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-input" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-input" placeholder="you@example.com" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-input" id="password" placeholder="Create password" required oninput="checkStrength()">
                            <div class="password-strength">
                                <div class="password-strength-bar" id="strengthBar"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-input" placeholder="Confirm password" required>
                        </div>
                    </div>

                    <!-- Student-specific fields -->
                    <div id="studentFields">
                        <div class="form-group">
                            <label class="form-label">University</label>
                            <input type="text" class="form-input" placeholder="Your university name">
                        </div>
                    </div>

                    <!-- Company-specific fields -->
                    <div id="companyFields" style="display: none;">
                        <div class="form-group">
                            <label class="form-label">Company Name</label>
                            <input type="text" class="form-input" placeholder="Your company name">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Industry</label>
                            <select class="form-input">
                                <option value="">Select industry</option>
                                <option value="technology">Technology</option>
                                <option value="finance">Finance</option>
                                <option value="healthcare">Healthcare</option>
                                <option value="education">Education</option>
                                <option value="marketing">Marketing</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="terms">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">
                            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>

                <div class="divider">
                    <span>Already have an account?</span>
                </div>

                <div class="auth-footer">
                    <p><a href="login.html">Sign in instead</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle fields based on role selection
        document.querySelectorAll('input[name="role"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.getElementById('studentFields').style.display = this.value === 'student' ? 'block' : 'none';
                document.getElementById('companyFields').style.display = this.value === 'company' ? 'block' : 'none';
            });
        });

        // Password strength checker
        function checkStrength() {
            const password = document.getElementById('password').value;
            const bar = document.getElementById('strengthBar');

            bar.className = 'password-strength-bar';

            if (password.length === 0) {
                bar.style.width = '0';
            } else if (password.length < 6) {
                bar.classList.add('strength-weak');
            } else if (password.length < 10) {
                bar.classList.add('strength-medium');
            } else {
                bar.classList.add('strength-strong');
            }
        }

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.querySelector('input[name="role"]:checked').value;
            if (role === 'student') {
                window.location.href = 'student-dashboard.html';
            } else {
                window.location.href = 'company-dashboard.html';
            }
        });
    </script>
</body>
</html>
